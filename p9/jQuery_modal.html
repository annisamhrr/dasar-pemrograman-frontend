<!DOCTYPE html>
<html>
<head>
    <title>Modal Gambar</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" crossorigin="anonymous"></script>
</head>
<body>
    <p>Tekan tombol untuk menampilkan gambar ke modal</p>
    <a class="btn btn-warning" id="tombol_klik" data-gmbr="w3.jpg">Klik saya</a>
    <br><br>
    <img src="w3.jpg" width="500px">
    
    <!-- Modal -->
    <div class="modal fade" id="modalGambar" role="dialog">
        <div class="modal-dialog">
            <form method="post" action="change-goal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title">Menampilkan gambar ke modal</h4>
                        <button type="button" class="close" data-dismiss="modal">&times;</button>
                    </div>
                    <div class="modal-body">
                        <img id="parse-src">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-default" data-dismiss="modal">Tutup</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <script>
        $(document).ready(function() {
            $("#tombol_klik").click(function(e) {
                e.preventDefault();
                var gmbr = $(this).attr('data-gmbr');
                
                $('#parse-src').attr('src', gmbr);
                $('#parse-src').attr('class', 'img-fluid');
                $('#parse-src').attr('alt', 'Gambar mahasiswa');
                
                $("#modalGambar").modal();
            });
        });
    </script>    
</body>
</html>
