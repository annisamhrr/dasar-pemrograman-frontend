<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUgas Hitung Klik</title>
</head>
<body>
    <button onclick="incrementCounter()">Tombol Klik</button>
    <p>Jumlah klik: <span id="clickCount">0</span></p>

    <script>
        let count = 0;

        function incrementCounter() {
            count++;
            document.getElementById("clickCount").innerText = count;
        }
    </script>
</body>
</html>
